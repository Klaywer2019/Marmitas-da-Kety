<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marmitas da Kety - Cardápio e Pedidos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-amber-50 min-h-screen text-slate-800 pb-20">

  <!-- Header -->
  <header class="bg-amber-600 text-white p-4 shadow-md sticky top-0 z-40">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold flex items-center gap-2">
          <i class="fa-solid font-bold fa-utensils"></i> Marmitas da Kety
        </h1>
        <p class="text-xs text-amber-100">Comida caseira feita com amor ❤️</p>
      </div>
      <button onclick="toggleAdminModal()" class="text-xs bg-amber-700 hover:bg-amber-800 px-3 py-1.5 rounded-lg font-medium transition">
        <i class="fa-solid fa-lock mr-1"></i> Painel
      </button>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- Cardápio do Dia -->
    <section>
      <h2 class="text-lg font-bold text-amber-900 border-b-2 border-amber-300 pb-1 mb-3 flex items-center justify-between">
        <span>🍲 Cardápio do Dia</span>
        <span class="text-xs font-normal text-amber-700 bg-amber-100 px-2 py-0.5 rounded-full">Atualizado</span>
      </h2>
      <div id="menu-container" class="space-y-3">
        <!-- Renderizado via JS -->
      </div>
    </section>

    <!-- Formulário do Cliente -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-amber-200 space-y-3">
      <h3 class="font-bold text-amber-900 flex items-center gap-2 border-b pb-2">
        <i class="fa-solid fa-user-pen text-amber-600"></i> Dados da Entrega
      </h3>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Seu Nome *</label>
        <input type="text" id="client-name" placeholder="Ex: Maria Silva" class="w-full text-sm p-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-amber-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Endereço de Entrega *</label>
        <input type="text" id="client-address" placeholder="Rua, Número, Bairro e Ponto de Ref." class="w-full text-sm p-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-amber-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Forma de Pagamento *</label>
        <select id="client-payment" class="w-full text-sm p-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-amber-500 bg-white">
          <option value="Pix">Pix (Chave enviada no Zap)</option>
          <option value="Dinheiro">Dinheiro</option>
          <option value="Cartão na Entrega">Cartão de Débito/Crédito</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Observações (Opcional)</label>
        <textarea id="client-obs" placeholder="Ex: Tirar a cebola, troco para 50..." rows="2" class="w-full text-sm p-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-amber-500"></textarea>
      </div>
    </section>

  </main>

  <!-- Barra de Carrinho / Botão do WhatsApp -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-3 shadow-lg z-30">
    <div class="max-w-md mx-auto flex items-center justify-between gap-3">
      <div>
        <p class="text-xs text-slate-500">Total do Pedido:</p>
        <p id="total-price" class="text-lg font-bold text-amber-700">R$ 0,00</p>
      </div>
      <button onclick="sendOrder()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-5 rounded-xl shadow transition flex items-center gap-2">
        <i class="fa-brands fa-whatsapp text-xl"></i> Enviar Pedido
      </button>
    </div>
  </div>

  <!-- Modal Admin (Painel da Kety) -->
  <div id="admin-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl p-5 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-slate-800 text-lg">Painel de Gerenciamento</h3>
        <button onclick="toggleAdminModal()" class="text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <form id="add-item-form" onsubmit="addNewItem(event)" class="space-y-3 bg-amber-50 p-3 rounded-xl border border-amber-200">
        <h4 class="font-bold text-sm text-amber-900">Cadastrar Novo Prato</h4>
        <input type="text" id="item-title" placeholder="Nome do Prato (Ex: Feijoada)" required class="w-full text-sm p-2 rounded border">
        <input type="text" id="item-desc" placeholder="Acompanhamentos (Ex: Arroz, couve, farofa)" required class="w-full text-sm p-2 rounded border">
        <div class="grid grid-cols-2 gap-2">
          <input type="number" step="0.01" id="item-price" placeholder="Preço (R$)" required class="text-sm p-2 rounded border">
          <button type="submit" class="bg-amber-600 text-white font-bold text-sm py-2 rounded hover:bg-amber-700 transition">
            + Adicionar
          </button>
        </div>
      </form>

      <div class="space-y-2">
        <h4 class="font-bold text-sm text-slate-700">Pratos Cadastrados</h4>
        <div id="admin-items-list" class="space-y-2">
          <!-- Itens do Admin -->
        </div>
      </div>
    </div>
  </div>

  <script>
    // Número do WhatsApp da Kety (DDI 55 + DDD 13 + Número)
    const KETY_PHONE = "5513988831650";

    // Dados iniciais (salvos no navegador)
    let menuItems = JSON.parse(localStorage.getItem('kety_menu')) || [
      { id: 1, title: 'Marmita de Feijoada', desc: 'Acompanha arroz, couve refogada, farofa e torresmo', price: 22.00, active: true },
      { id: 2, title: 'Strogonoff de Frango', desc: 'Acompanha arroz branco e batata palha', price: 20.00, active: true },
      { id: 3, title: 'Bife Acebolado', desc: 'Acompanha arroz, feijão, farofa e salada', price: 20.00, active: true }
    ];

    let cart = {};

    function saveMenu() {
      localStorage.setItem('kety_menu', JSON.stringify(menuItems));
      renderMenu();
      renderAdminList();
    }

    function renderMenu() {
      const container = document.getElementById('menu-container');
      container.innerHTML = '';

      const activeItems = menuItems.filter(item => item.active);

      if (activeItems.length === 0) {
        container.innerHTML = `<p class="text-center text-slate-500 py-6 text-sm">Nenhum prato disponível hoje.</p>`;
        return;
      }

      activeItems.forEach(item => {
        const qty = cart[item.id] || 0;
        container.innerHTML += `
          <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center gap-3">
            <div class="flex-1">
              <h3 class="font-bold text-slate-800 text-base">${item.title}</h3>
              <p class="text-xs text-slate-500 line-clamp-2 mt-0.5">${item.desc}</p>
              <p class="text-sm font-bold text-amber-600 mt-1">R$ ${item.price.toFixed(2).replace('.', ',')}</p>
            </div>
            <div class="flex items-center bg-amber-100 rounded-lg p-1 border border-amber-200">
              <button onclick="updateQty(${item.id}, -1)" class="w-7 h-7 bg-white rounded-md text-amber-800 font-bold shadow-xs hover:bg-amber-50">-</button>
              <span class="w-8 text-center text-sm font-bold text-amber-900">${qty}</span>
              <button onclick="updateQty(${item.id}, 1)" class="w-7 h-7 bg-amber-600 rounded-md text-white font-bold shadow-xs hover:bg-amber-700">+</button>
            </div>
          </div>
        `;
      });

      calculateTotal();
    }

    function updateQty(id, change) {
      const current = cart[id] || 0;
      const updated = current + change;
      if (updated <= 0) {
        delete cart[id];
      } else {
        cart[id] = updated;
      }
      renderMenu();
    }

    function calculateTotal() {
      let total = 0;
      for (const id in cart) {
        const item = menuItems.find(i => i.id == id);
        if (item) {
          total += item.price * cart[id];
        }
      }
      document.getElementById('total-price').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
      return total;
    }

    function sendOrder() {
      const name = document.getElementById('client-name').value.trim();
      const address = document.getElementById('client-address').value.trim();
      const payment = document.getElementById('client-payment').value;
      const obs = document.getElementById('client-obs').value.trim();

      const orderKeys = Object.keys(cart);

      if (orderKeys.length === 0) {
        alert("Por favor, selecione pelo menos uma marmita no cardápio!");
        return;
      }

      if (!name || !address) {
        alert("Por favor, preencha seu Nome e Endereço de entrega!");
        return;
      }

      let orderText = `*NOVO PEDIDO - MARMITAS DA KETY* 🍱\n\n`;
      orderText += `👤 *Cliente:* ${name}\n`;
      orderText += `📍 *Endereço:* ${address}\n`;
      orderText += `💳 *Pagamento:* ${payment}\n`;
      if (obs) orderText += `📝 *Obs:* ${obs}\n`;

      orderText += `\n*ITENS DO PEDIDO:*\n`;

      orderKeys.forEach(id => {
        const item = menuItems.find(i => i.id == id);
        const subtotal = item.price * cart[id];
        orderText += `• ${cart[id]}x ${item.title} (R$ ${subtotal.toFixed(2).replace('.', ',')})\n`;
      });

      const total = calculateTotal();
      orderText += `\n*TOTAL: R$ ${total.toFixed(2).replace('.', ',')}*`;

      const encodedMsg = encodeURIComponent(orderText);
      const whatsappUrl = `https://wa.me/${KETY_PHONE}?text=${encodedMsg}`;

      window.open(whatsappUrl, '_blank');
    }

    function toggleAdminModal() {
      const modal = document.getElementById('admin-modal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) {
        renderAdminList();
      }
    }

    function renderAdminList() {
      const list = document.getElementById('admin-items-list');
      list.innerHTML = '';

      menuItems.forEach(item => {
        list.innerHTML += `
          <div class="flex items-center justify-between p-2 bg-slate-50 rounded-lg border text-xs">
            <div>
              <p class="font-bold text-slate-700">${item.title}</p>
              <p class="text-slate-500">R$ ${item.price.toFixed(2)}</p>
            </div>
            <div class="flex gap-2">
              <button onclick="toggleItemActive(${item.id})" class="px-2 py-1 rounded ${item.active ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-600'} font-bold">
                ${item.active ? 'Ativo' : 'Pausado'}
              </button>
              <button onclick="deleteItem(${item.id})" class="text-red-500 hover:text-red-700 p-1">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>
        `;
      });
    }

    function addNewItem(e) {
      e.preventDefault();
      const title = document.getElementById('item-title').value.trim();
      const desc = document.getElementById('item-desc').value.trim();
      const price = parseFloat(document.getElementById('item-price').value);

      if (title && desc && !isNaN(price)) {
        const newItem = {
          id: Date.now(),
          title,
          desc,
          price,
          active: true
        };
        menuItems.push(newItem);
        saveMenu();
        document.getElementById('add-item-form').reset();
      }
    }

    function toggleItemActive(id) {
      const item = menuItems.find(i => i.id === id);
      if (item) {
        item.active = !item.active;
        saveMenu();
      }
    }

    function deleteItem(id) {
      if (confirm("Tem certeza que deseja apagar este prato?")) {
        menuItems = menuItems.filter(i => i.id !== id);
        delete cart[id];
        saveMenu();
      }
    }

    // Inicialização
    renderMenu();
  </script>
</body>
</html>
