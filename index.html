<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marmita Caseira da Kety</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      background-color: #0f0f11;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .card-dark {
      background-color: #18181c;
      border: 1px solid #27272a;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #3f3f46;
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen pb-28 custom-scrollbar">

  <!-- Header -->
  <header class="bg-[#18181c] border-b border-[#27272a] p-4 sticky top-0 z-40">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-orange-600 flex items-center justify-center text-white text-lg font-bold">
          <i class="fa-solid fa-utensils"></i>
        </div>
        <div>
          <h1 class="font-bold text-white text-base leading-tight">Marmita Caseira da Kety</h1>
          <span class="text-xs text-emerald-400 flex items-center gap-1 font-medium">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Aberto para Pedidos
          </span>
        </div>
      </div>
      <button onclick="requestAdminAccess()" class="bg-[#27272a] hover:bg-[#3f3f46] text-orange-400 border border-orange-500/30 text-xs px-3 py-2 rounded-xl font-medium transition flex items-center gap-1.5">
        <i class="fa-solid fa-shield-halved"></i> Admin
      </button>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="max-w-md mx-auto p-4 space-y-5">

    <!-- Seção de Pratos -->
    <section>
      <h2 class="text-xs font-bold text-zinc-400 uppercase tracking-wider mb-3 flex items-center gap-2">
        <i class="fa-solid fa-fire text-orange-500"></i> Cardápio do Dia
      </h2>
      <div id="menu-container" class="space-y-3">
        <!-- Renderizado via JS -->
      </div>
    </section>

    <!-- Formulário do Cliente -->
    <section class="card-dark p-4 rounded-2xl space-y-3">
      <h3 class="text-sm font-bold text-white flex items-center gap-2 border-b border-[#27272a] pb-2">
        <i class="fa-solid fa-location-dot text-orange-500"></i> Dados da Entrega
      </h3>
      
      <div>
        <label class="block text-xs font-medium text-zinc-400 mb-1">Seu Nome *</label>
        <input type="text" id="client-name" placeholder="Como podemos te chamar?" class="w-full text-sm bg-[#0f0f11] border border-[#27272a] rounded-xl p-2.5 text-white placeholder-zinc-600 focus:outline-none focus:border-orange-500">
      </div>

      <div>
        <label class="block text-xs font-medium text-zinc-400 mb-1">Endereço Completo *</label>
        <input type="text" id="client-address" placeholder="Rua, Número, Bairro e Ponto de Ref." class="w-full text-sm bg-[#0f0f11] border border-[#27272a] rounded-xl p-2.5 text-white placeholder-zinc-600 focus:outline-none focus:border-orange-500">
      </div>

      <div>
        <label class="block text-xs font-medium text-zinc-400 mb-1">Forma de Pagamento *</label>
        <div class="grid grid-cols-3 gap-2 mt-1">
          <button type="button" onclick="selectPayment('Pix')" id="pay-Pix" class="pay-btn active bg-orange-500/10 border-orange-500 text-orange-400 border text-xs py-2 rounded-xl font-medium">💚 Pix</button>
          <button type="button" onclick="selectPayment('Cartão')" id="pay-Cartão" class="pay-btn bg-[#0f0f11] border-[#27272a] text-zinc-400 border text-xs py-2 rounded-xl font-medium">💳 Cartão</button>
          <button type="button" onclick="selectPayment('Dinheiro')" id="pay-Dinheiro" class="pay-btn bg-[#0f0f11] border-[#27272a] text-zinc-400 border text-xs py-2 rounded-xl font-medium">💵 Dinheiro</button>
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-zinc-400 mb-1">Observações (Opcional)</label>
        <textarea id="client-obs" placeholder="Sem cebola, troco para 50, etc." rows="2" class="w-full text-sm bg-[#0f0f11] border border-[#27272a] rounded-xl p-2.5 text-white placeholder-zinc-600 focus:outline-none focus:border-orange-500 resize-none"></textarea>
      </div>
    </section>

  </main>

  <!-- Barra Fixa Inferior (Enviar Pedido) -->
  <div class="fixed bottom-0 left-0 right-0 bg-[#18181c] border-t border-[#27272a] p-3 z-30">
    <div class="max-w-md mx-auto flex items-center justify-between gap-3">
      <div>
        <p class="text-[10px] text-zinc-500 uppercase tracking-wider">Total do Pedido</p>
        <p id="total-price" class="text-xl font-bold text-orange-500">R$ 0,00</p>
      </div>
      <button onclick="sendOrder()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-5 rounded-xl shadow-lg transition flex items-center gap-2 text-sm">
        <i class="fa-brands fa-whatsapp text-lg"></i> Enviar Pedido pelo WhatsApp
      </button>
    </div>
  </div>

  <!-- Modal de Alerta / Erro Estilizado -->
  <div id="custom-alert-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="card-dark w-full max-w-xs rounded-2xl p-5 text-center space-y-4 border border-zinc-700 shadow-2xl">
      <div class="w-12 h-12 rounded-full bg-orange-500/10 border border-orange-500/30 text-orange-500 mx-auto flex items-center justify-center text-xl">
        <i class="fa-solid fa-circle-exclamation"></i>
      </div>
      <p id="alert-message-text" class="text-sm font-medium text-zinc-200"></p>
      <button onclick="closeAlert()" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold text-xs py-2.5 rounded-xl transition">
        Entendido
      </button>
    </div>
  </div>

  <!-- Modal de Confirmação de Senha Admin -->
  <div id="password-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="card-dark w-full max-w-xs rounded-2xl p-5 space-y-4 border border-zinc-700 shadow-2xl">
      <div class="text-center">
        <div class="w-10 h-10 rounded-full bg-orange-500/10 border border-orange-500/30 text-orange-500 mx-auto flex items-center justify-center text-lg mb-2">
          <i class="fa-solid fa-lock"></i>
        </div>
        <h3 class="font-bold text-white text-base">Acesso Restrito</h3>
        <p class="text-xs text-zinc-400 mt-0.5">Digite a senha da Kety para continuar</p>
      </div>
      
      <input type="password" id="admin-pass-input" placeholder="Sua senha" class="w-full text-sm bg-[#0f0f11] border border-[#27272a] rounded-xl p-2.5 text-white placeholder-zinc-600 focus:outline-none focus:border-orange-500 text-center">
      
      <div class="grid grid-cols-2 gap-2">
        <button onclick="closePasswordModal()" class="bg-[#27272a] text-zinc-400 text-xs font-medium py-2.5 rounded-xl">Cancelar</button>
        <button onclick="validateAdminPassword()" class="bg-orange-600 text-white text-xs font-bold py-2.5 rounded-xl">Entrar</button>
      </div>
    </div>
  </div>

  <!-- Modal Admin (Painel da Kety) -->
  <div id="admin-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="card-dark w-full max-w-md rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto custom-scrollbar border border-zinc-700">
      <div class="flex justify-between items-center border-b border-[#27272a] pb-3">
        <div>
          <h3 class="font-bold text-white text-base">Painel de Controle</h3>
          <p class="text-xs text-zinc-400">Edite seu cardápio com 1 toque</p>
        </div>
        <button onclick="closeAdminModal()" class="text-zinc-400 hover:text-white">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <!-- Form para adicionar novo prato -->
      <form id="add-item-form" onsubmit="addNewItem(event)" class="space-y-2.5 bg-[#0f0f11] p-3 rounded-xl border border-[#27272a]">
        <h4 class="font-bold text-xs text-orange-400 uppercase tracking-wider">+ Cadastrar Novo Prato</h4>
        <input type="text" id="item-title" placeholder="Nome do Prato (Ex: Bife Acebolado)" required class="w-full text-xs bg-[#18181c] border border-[#27272a] rounded-lg p-2 text-white">
        <input type="text" id="item-desc" placeholder="Acompanhamentos (Ex: Arroz, feijão, salada)" required class="w-full text-xs bg-[#18181c] border border-[#27272a] rounded-lg p-2 text-white">
        <div class="grid grid-cols-2 gap-2">
          <input type="number" step="0.01" id="item-price" placeholder="Preço (Ex: 20.00)" required class="text-xs bg-[#18181c] border border-[#27272a] rounded-lg p-2 text-white">
          <button type="submit" class="bg-orange-600 hover:bg-orange-500 text-white font-bold text-xs py-2 rounded-lg transition">
            Adicionar
          </button>
        </div>
      </form>

      <!-- Lista de Pratos Cadastrados -->
      <div class="space-y-2">
        <h4 class="font-bold text-xs text-zinc-400 uppercase tracking-wider">Itens do Cardápio</h4>
        <div id="admin-items-list" class="space-y-2">
          <!-- JS -->
        </div>
      </div>
    </div>
  </div>

  <script>
    // WhatsApp da Kety
    const KETY_PHONE = "5513988831650";
    const ADMIN_PASS = "KethillynMarmitas1650";

    let selectedPaymentMethod = 'Pix';

    // Itens Iniciais
    let menuItems = JSON.parse(localStorage.getItem('kety_menu_dark')) || [
      { id: 1, title: 'Feijoada Completa', desc: 'Acompanha arroz, couve refogada, farofa e torresmo', price: 25.00, active: true },
      { id: 2, title: 'Bife a Parmegiana', desc: 'Acompanha arroz branco e batata frita', price: 22.00, active: true },
      { id: 3, title: 'Frango Grelhado Fit', desc: 'Acompanha arroz integral, feijão e salada fresca', price: 19.00, active: true }
    ];

    let cart = {};

    function saveMenu() {
      localStorage.setItem('kety_menu_dark', JSON.stringify(menuItems));
      renderMenu();
      renderAdminList();
    }

    function renderMenu() {
      const container = document.getElementById('menu-container');
      container.innerHTML = '';

      const activeItems = menuItems.filter(item => item.active);

      if (activeItems.length === 0) {
        container.innerHTML = `<p class="text-center text-zinc-500 py-8 text-xs">Nenhum prato disponível no momento.</p>`;
        return;
      }

      activeItems.forEach(item => {
        const qty = cart[item.id] || 0;
        container.innerHTML += `
          <div class="card-dark p-4 rounded-2xl flex justify-between items-center gap-3">
            <div class="flex-1">
              <h3 class="font-bold text-white text-sm">${item.title}</h3>
              <p class="text-xs text-zinc-400 mt-1 line-clamp-2">${item.desc}</p>
              <p class="text-sm font-bold text-orange-500 mt-2">R$ ${item.price.toFixed(2).replace('.', ',')}</p>
            </div>
            <div class="flex items-center bg-[#0f0f11] rounded-xl p-1 border border-[#27272a]">
              <button onclick="updateQty(${item.id}, -1)" class="w-8 h-8 rounded-lg bg-[#18181c] text-orange-400 font-bold hover:bg-[#27272a] transition flex items-center justify-center">-</button>
              <span class="w-8 text-center text-xs font-bold text-white">${qty}</span>
              <button onclick="updateQty(${item.id}, 1)" class="w-8 h-8 rounded-lg bg-orange-600 text-white font-bold hover:bg-orange-500 transition flex items-center justify-center">+</button>
            </div>
          </div>
        `;
      });

      calculateTotal();
    }

    function updateQty(id, change) {
      const current = cart[id] || 0;
      const updated = current + change;
      if (updated <= 0) {
        delete cart[id];
      } else {
        cart[id] = updated;
      }
      renderMenu();
    }

    function calculateTotal() {
      let total = 0;
      for (const id in cart) {
        const item = menuItems.find(i => i.id == id);
        if (item) {
          total += item.price * cart[id];
        }
      }
      document.getElementById('total-price').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
      return total;
    }

    function selectPayment(method) {
      selectedPaymentMethod = method;
      document.querySelectorAll('.pay-btn').forEach(btn => {
        btn.classList.remove('active', 'bg-orange-500/10', 'border-orange-500', 'text-orange-400');
        btn.classList.add('bg-[#0f0f11]', 'border-[#27272a]', 'text-zinc-400');
      });
      const activeBtn = document.getElementById(`pay-${method}`);
      activeBtn.classList.add('active', 'bg-orange-500/10', 'border-orange-500', 'text-orange-400');
      activeBtn.classList.remove('bg-[#0f0f11]', 'border-[#27272a]', 'text-zinc-400');
    }

    function sendOrder() {
      const name = document.getElementById('client-name').value.trim();
      const address = document.getElementById('client-address').value.trim();
      const obs = document.getElementById('client-obs').value.trim();

      const orderKeys = Object.keys(cart);

      if (orderKeys.length === 0) {
        showAlert("Por favor, selecione pelo menos uma marmita no cardápio!");
        return;
      }

      if (!name || !address) {
        showAlert("Por favor, preencha seu Nome e Endereço de entrega!");
        return;
      }

      let orderText = `*NOVO PEDIDO - MARMITA CASEIRA DA KETY* 🍱\n\n`;
      orderText += `👤 *Cliente:* ${name}\n`;
      orderText += `📍 *Endereço:* ${address}\n`;
      orderText += `💳 *Pagamento:* ${selectedPaymentMethod}\n`;
      if (obs) orderText += `📝 *Obs:* ${obs}\n`;

      orderText += `\n*ITENS DO PEDIDO:*\n`;

      orderKeys.forEach(id => {
        const item = menuItems.find(i => i.id == id);
        const subtotal = item.price * cart[id];
        orderText += `• ${cart[id]}x ${item.title} (R$ ${subtotal.toFixed(2).replace('.', ',')})\n`;
      });

      const total = calculateTotal();
      orderText += `\n*TOTAL: R$ ${total.toFixed(2).replace('.', ',')}*`;

      const encodedMsg = encodeURIComponent(orderText);
      const whatsappUrl = `https://wa.me/${KETY_PHONE}?text=${encodedMsg}`;

      window.open(whatsappUrl, '_blank');
    }

    // Modal de Alertas Estilizados
    function showAlert(msg) {
      document.getElementById('alert-message-text').innerText = msg;
      document.getElementById('custom-alert-modal').classList.remove('hidden');
    }

    function closeAlert() {
      document.getElementById('custom-alert-modal').classList.add('hidden');
    }

    // Trava de Senha Admin
    function requestAdminAccess() {
      document.getElementById('admin-pass-input').value = '';
      document.getElementById('password-modal').classList.remove('hidden');
    }

    function closePasswordModal() {
      document.getElementById('password-modal').classList.add('hidden');
    }

    function validateAdminPassword() {
      const pass = document.getElementById('admin-pass-input').value;
      if (pass === ADMIN_PASS) {
        closePasswordModal();
        openAdminModal();
      } else {
        showAlert("Senha incorreta! Apenas a Kety pode acessar.");
      }
    }

    function openAdminModal() {
      renderAdminList();
      document.getElementById('admin-modal').classList.remove('hidden');
    }

    function closeAdminModal() {
      document.getElementById('admin-modal').classList.add('hidden');
    }

    function renderAdminList() {
      const list = document.getElementById('admin-items-list');
      list.innerHTML = '';

      menuItems.forEach(item => {
        list.innerHTML += `
          <div class="flex items-center justify-between p-3 bg-[#0f0f11] rounded-xl border border-[#27272a] text-xs">
            <div>
              <p class="font-bold text-white">${item.title}</p>
              <p class="text-orange-400 font-medium">R$ ${item.price.toFixed(2)}</p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="toggleItemActive(${item.id})" class="px-2.5 py-1 rounded-lg ${item.active ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30' : 'bg-zinc-800 text-zinc-500'} font-medium">
                ${item.active ? 'Disponível' : 'Pausado'}
              </button>
              <button onclick="deleteItem(${item.id})" class="text-red-400 hover:text-red-300 p-1">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>
        `;
      });
    }

    function addNewItem(e) {
      e.preventDefault();
      const title = document.getElementById('item-title').value.trim();
      const desc = document.getElementById('item-desc').value.trim();
      const price = parseFloat(document.getElementById('item-price').value);

      if (title && desc && !isNaN(price)) {
        const newItem = {
          id: Date.now(),
          title,
          desc,
          price,
          active: true
        };
        menuItems.push(newItem);
        saveMenu();
        document.getElementById('add-item-form').reset();
      }
    }

    function toggleItemActive(id) {
      const item = menuItems.find(i => i.id === id);
      if (item) {
        item.active = !item.active;
        saveMenu();
      }
    }

    function deleteItem(id) {
      menuItems = menuItems.filter(i => i.id !== id);
      delete cart[id];
      saveMenu();
    }

    // Inicializar
    renderMenu();
  </script>
</body>
</html>
